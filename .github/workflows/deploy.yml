# Deploy: staging branch -> staging Worker, main branch -> production Worker.
# Tests must pass first. Each environment's D1 migrations are applied before its
# new code goes live. Production also backs up its database before migrating.
name: Deploy

on:
  push:
    branches: [staging, main]

permissions:
  contents: read

# One deploy per branch at a time; never cancel a deploy halfway through.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    name: Deploy ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Cloudflare token lives only in these GitHub Environments.
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ vars.SITE_URL }}
    env:
      TARGET: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Back up production database
        if: env.TARGET == 'production'
        run: npx wrangler d1 export DB --env production --remote --output "d1-backup-${GITHUB_SHA}.sql"
      - name: Keep backup
        if: env.TARGET == 'production'
        uses: actions/upload-artifact@v7
        with:
          name: d1-backup-${{ github.sha }}
          path: d1-backup-${{ github.sha }}.sql
          retention-days: 90
          if-no-files-found: error

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --env "$TARGET" --remote

      # Staging only: load sample data. Seed files use INSERT OR IGNORE, so this is safe to repeat.
      - name: Load sample data
        if: env.TARGET == 'staging'
        run: |
          for f in seed/*.sql; do
            [ -e "$f" ] || continue
            npx wrangler d1 execute DB --env staging --remote --file "$f"
          done

      - name: Build and deploy
        run: node scripts/deploy.mjs "$TARGET"
