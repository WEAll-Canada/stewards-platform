# Playwright tests. Runs on pushes to work branches and on PRs into main.
# Pushes to staging/main are tested by deploy.yml, which calls this workflow
# before deploying, so they aren't tested twice.
name: Test

on:
  push:
    branches-ignore: [staging, main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
